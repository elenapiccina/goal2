<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion ADHD Goals Widget</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Canvas Confetti for Visual Dopamine Micro-rewards -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Google Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
    }

    body {
      background: linear-gradient(135deg, #f7f9fc 0%, #f0f3f8 40%, #e8edf5 100%);
      min-height: 100vh;
      color: #334155;
      padding: 16px;
      margin: 0;
      overflow-x: auto;
    }

    /* Core Glassmorphism Base Panel */
    .glass-panel {
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 24px;
      position: relative;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Glowing Reflective Borders */
    .glass-panel::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 24px;
      padding: 1.5px;
      background: linear-gradient(
        135deg, 
        rgba(255, 255, 255, 0.95) 0%, 
        rgba(255, 255, 255, 0.35) 40%, 
        rgba(255, 255, 255, 0.15) 60%, 
        rgba(255, 255, 255, 0.85) 100%
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Glossy Edge Reflection Shine Animation */
    .shine-effect {
      position: relative;
      overflow: hidden;
    }

    .shine-effect::before {
      content: '';
      position: absolute;
      top: 0;
      left: -150%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg, 
        transparent, 
        rgba(255, 255, 255, 0.45), 
        transparent
      );
      transform: skewX(-20deg);
      pointer-events: none;
      animation: shineLoop 8s infinite ease-in-out;
    }

    @keyframes shineLoop {
      0% { left: -150%; }
      20% { left: 150%; }
      100% { left: 150%; }
    }

    /* Column 1: Small Goals - Soft Mint (#D8F3DC) */
    .glass-small {
      background: rgba(216, 243, 220, 0.6);
      box-shadow: 
        0 10px 32px -5px rgba(183, 228, 199, 0.5),
        inset 0 1px 2px rgba(255, 255, 255, 0.9);
    }
    .glass-small:hover {
      box-shadow: 
        0 14px 38px -3px rgba(183, 228, 199, 0.7),
        inset 0 1px 3px rgba(255, 255, 255, 1);
    }

    /* Column 2: Big Goals - Soft Aesthetic Pink (#FAD1D9) */
    .glass-big {
      background: rgba(250, 209, 217, 0.62);
      box-shadow: 
        0 10px 32px -5px rgba(244, 170, 185, 0.5),
        inset 0 1px 2px rgba(255, 255, 255, 0.9);
    }
    .glass-big:hover {
      box-shadow: 
        0 14px 38px -3px rgba(244, 170, 185, 0.7),
        inset 0 1px 3px rgba(255, 255, 255, 1);
    }

    /* Column 3: Future Goals - Slate Blue-Grey (#7D99A4) */
    .glass-future {
      background: rgba(125, 153, 164, 0.45);
      box-shadow: 
        0 10px 32px -5px rgba(125, 153, 164, 0.45),
        inset 0 1px 2px rgba(255, 255, 255, 0.8);
    }
    .glass-future:hover {
      box-shadow: 
        0 14px 38px -3px rgba(125, 153, 164, 0.65),
        inset 0 1px 3px rgba(255, 255, 255, 0.95);
    }

    /* Goal Cards Inside Columns */
    .goal-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: grab;
    }
    .goal-card:active {
      cursor: grabbing;
    }
    .goal-card:hover {
      background: rgba(255, 255, 255, 0.96);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
    }
    .goal-card.dragging {
      opacity: 0.4;
      transform: scale(0.97);
    }

    /* Drag over column container visual drop target indicator */
    .drag-over-container {
      outline: 2px dashed #6366f1 !important;
      outline-offset: -4px;
      background: rgba(255, 255, 255, 0.85) !important;
    }

    /* Status Badge Styles */
    .badge-now {
      background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
      color: #FFFFFF;
      border: 1px solid #FCA5A5;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.35);
      animation: pulseGlow 2s infinite ease-in-out;
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 6px rgba(239, 68, 68, 0.4); }
      50% { box-shadow: 0 0 14px rgba(239, 68, 68, 0.75); }
    }

    /* Graphite Grey Aesthetic for 🪩 Not Started */
    .badge-not-started {
      background-color: #334155;
      color: #F8FAFC;
      border: 1px solid #475569;
      box-shadow: 0 2px 6px rgba(51, 65, 85, 0.25);
    }

    .badge-in-progress {
      background-color: #FEF3C7;
      color: #92400E;
      border: 1px solid #FDE68A;
    }
    .badge-started {
      background-color: #FCE7F3;
      color: #9D174D;
      border: 1px solid #FBCFE8;
    }
    .badge-completed {
      background-color: #D1FAE5;
      color: #065F46;
      border: 1px solid #A7F3D0;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.12);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.25);
    }
  </style>
</head>
<body class="flex flex-col gap-4 max-w-7xl mx-auto">

  <!-- Header Dashboard Bar -->
  <header class="glass-panel p-4 flex flex-wrap items-center justify-between gap-3 bg-white/50 border border-white/80 shadow-sm">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-white/90 flex items-center justify-center text-xl shadow-inner border border-white text-purple-600">
        🎯
      </div>
      <div>
        <h1 class="text-lg font-extrabold text-slate-800 tracking-tight leading-none">Goals Dashboard</h1>
        <p class="text-xs text-slate-500 mt-1 font-semibold flex items-center gap-1.5">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          ADHD Low-Friction Focus Tracker
        </p>
      </div>
    </div>

    <div class="flex items-center gap-2.5 flex-wrap">
      <!-- NOW Hyperfocus Count Pill -->
      <div title="Goals currently marked as NOW" class="px-3 py-1.5 rounded-xl bg-red-50 border border-red-200 text-xs font-bold text-red-600 flex items-center gap-1.5 shadow-xs">
        <span>🔥</span>
        <span id="now-goal-stats">0 NOW</span>
      </div>

      <!-- Total Progress Summary Pill -->
      <div class="px-3 py-1.5 rounded-xl bg-white/80 border border-white/90 text-xs font-bold text-slate-700 flex items-center gap-2 shadow-xs">
        <i class="fa-solid fa-trophy text-amber-400"></i>
        <span id="overall-goal-stats">0 Goals Total</span>
      </div>

      <!-- Add Goal Button -->
      <button onclick="openAddGoalModal('Small Goals')" 
        class="px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold transition flex items-center gap-2 shadow-md active:scale-95">
        <i class="fa-solid fa-plus"></i>
        <span>Add Goal</span>
      </button>

      <!-- Reset Demo Data -->
      <button onclick="resetDefaultData()" title="Reset default goals data" 
        class="w-8 h-8 rounded-xl bg-white/80 hover:bg-rose-50 border border-white/90 text-xs text-slate-500 hover:text-rose-500 transition flex items-center justify-center shadow-xs">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
    </div>
  </header>

  <!-- Horizontal Side-by-Side 3-Column Layout -->
  <main class="grid grid-cols-1 md:grid-cols-3 gap-5 w-full items-start">

    <!-- COLUMN 1: Small Goals (#D8F3DC) -->
    <section class="glass-panel glass-small p-5 shine-effect flex flex-col gap-4 min-h-[400px] transition-all"
      ondragover="handleDragOver(event)"
      ondragenter="handleDragEnter(event, 'Small Goals')"
      ondragleave="handleDragLeave(event, 'Small Goals')"
      ondrop="handleDrop(event, 'Small Goals')"
      id="col-small">
      <div class="flex flex-col gap-1.5">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="text-lg">🌱</span>
            <h2 class="font-extrabold text-slate-800 text-base">Small Goals</h2>
          </div>
          <div class="flex items-center gap-1.5">
            <span id="badge-small" class="text-xs font-extrabold px-2.5 py-0.5 rounded-full bg-white/90 text-emerald-900 border border-white/80 shadow-xs">0</span>
            <button onclick="openAddGoalModal('Small Goals')" title="Add Small Goal" class="w-6 h-6 rounded-lg bg-white/80 hover:bg-white text-emerald-800 text-xs font-extrabold flex items-center justify-center transition shadow-2xs">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>
        </div>
        <p class="text-[11px] font-bold text-emerald-950/70">Quick Wins • 1 to 7 Days</p>
      </div>

      <!-- Goal List Container -->
      <div id="container-small" class="flex flex-col gap-3.5 flex-1"></div>
    </section>

    <!-- COLUMN 2: Big Goals (#FAD1D9) -->
    <section class="glass-panel glass-big p-5 shine-effect flex flex-col gap-4 min-h-[400px] transition-all"
      ondragover="handleDragOver(event)"
      ondragenter="handleDragEnter(event, 'Big Goals')"
      ondragleave="handleDragLeave(event, 'Big Goals')"
      ondrop="handleDrop(event, 'Big Goals')"
      id="col-big">
      <div class="flex flex-col gap-1.5">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="text-lg">⚡</span>
            <h2 class="font-extrabold text-slate-800 text-base">Big Goals</h2>
          </div>
          <div class="flex items-center gap-1.5">
            <span id="badge-big" class="text-xs font-extrabold px-2.5 py-0.5 rounded-full bg-white/90 text-rose-900 border border-white/80 shadow-xs">0</span>
            <button onclick="openAddGoalModal('Big Goals')" title="Add Big Goal" class="w-6 h-6 rounded-lg bg-white/80 hover:bg-white text-rose-800 text-xs font-extrabold flex items-center justify-center transition shadow-2xs">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>
        </div>
        <p class="text-[11px] font-bold text-rose-950/70">Core Focus • 1 to 3 Months</p>
      </div>

      <!-- Goal List Container -->
      <div id="container-big" class="flex flex-col gap-3.5 flex-1"></div>
    </section>

    <!-- COLUMN 3: Future Goals (#7D99A4) -->
    <section class="glass-panel glass-future p-5 shine-effect flex flex-col gap-4 min-h-[400px] transition-all"
      ondragover="handleDragOver(event)"
      ondragenter="handleDragEnter(event, 'Future Goals')"
      ondragleave="handleDragLeave(event, 'Future Goals')"
      ondrop="handleDrop(event, 'Future Goals')"
      id="col-future">
      <div class="flex flex-col gap-1.5">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="text-lg">✨</span>
            <h2 class="font-extrabold text-slate-900 text-base">Future Goals</h2>
          </div>
          <div class="flex items-center gap-1.5">
            <span id="badge-future" class="text-xs font-extrabold px-2.5 py-0.5 rounded-full bg-slate-900/80 text-white border border-white/40 shadow-xs">0</span>
            <button onclick="openAddGoalModal('Future Goals')" title="Add Future Goal" class="w-6 h-6 rounded-lg bg-white/80 hover:bg-white text-slate-800 text-xs font-extrabold flex items-center justify-center transition shadow-2xs">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>
        </div>
        <p class="text-[11px] font-bold text-slate-900/80">Someday & Vision Board</p>
      </div>

      <!-- Goal List Container -->
      <div id="container-future" class="flex flex-col gap-3.5 flex-1"></div>
    </section>

  </main>

  <!-- Modal Overlay for Adding / Editing Goals -->
  <div id="goal-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="glass-panel bg-white/95 p-6 rounded-3xl w-full max-w-md shadow-2xl border border-white flex flex-col gap-4 relative animate-in fade-in zoom-in duration-200 max-h-[90vh] overflow-y-auto">
      
      <div class="flex items-center justify-between border-b border-slate-200/60 pb-3">
        <h3 id="modal-title" class="font-extrabold text-slate-800 text-base flex items-center gap-2">
          <i class="fa-solid fa-bullseye text-purple-500"></i> Add New Goal
        </h3>
        <button onclick="closeGoalModal()" class="w-7 h-7 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center text-xs transition">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="goal-form" onsubmit="handleGoalFormSubmit(event)" class="flex flex-col gap-3.5">
        <input type="hidden" id="form-goal-id" value="">

        <!-- Title Input -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Goal Title *</label>
          <input type="text" id="form-title" required placeholder="e.g. Organize desk setup" 
            class="w-full px-3.5 py-2 text-xs rounded-xl bg-slate-50 border border-slate-200 focus:border-purple-400 focus:bg-white text-slate-800 outline-none transition font-semibold" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <!-- Category Select -->
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Category / Timeframe</label>
            <select id="form-category" 
              class="w-full px-3 py-2 text-xs rounded-xl bg-slate-50 border border-slate-200 focus:border-purple-400 focus:bg-white text-slate-800 outline-none transition font-semibold">
              <option value="Small Goals">🌱 Small Goals (1-7 days)</option>
              <option value="Big Goals">⚡ Big Goals (1-3 mos)</option>
              <option value="Future Goals">✨ Future Goals (Someday)</option>
            </select>
          </div>

          <!-- Status Select -->
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Status</label>
            <select id="form-status" 
              class="w-full px-3 py-2 text-xs rounded-xl bg-slate-50 border border-slate-200 focus:border-purple-400 focus:bg-white text-slate-800 outline-none transition font-semibold">
              <option value="NOW">🔥 NOW</option>
              <option value="Not Started">🪩 Not Started</option>
              <option value="In Progress">🟡 In Progress</option>
              <option value="Started">🌸 Started</option>
              <option value="Completed">❇️ Completed</option>
            </select>
          </div>
        </div>

        <!-- Target Date -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Target Date / Note (Optional)</label>
          <input type="text" id="form-target-date" placeholder="e.g. By Friday or Next Month" 
            class="w-full px-3.5 py-2 text-xs rounded-xl bg-slate-50 border border-slate-200 focus:border-purple-400 focus:bg-white text-slate-800 outline-none transition font-semibold" />
        </div>

        <!-- Micro-steps / Sub-notes -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Micro Sub-steps (One per line)</label>
          <textarea id="form-notes" rows="3" placeholder="e.g. Clear off monitor&#10;Sort cables&#10;Wipe surface"
            class="w-full px-3.5 py-2 text-xs rounded-xl bg-slate-50 border border-slate-200 focus:border-purple-400 focus:bg-white text-slate-800 outline-none transition font-semibold resize-none"></textarea>
        </div>

        <div class="flex items-center justify-end gap-2 mt-2">
          <button type="button" onclick="closeGoalModal()" 
            class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold transition">
            Cancel
          </button>
          <button type="submit" 
            class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold transition shadow-sm">
            Save Goal
          </button>
        </div>
      </form>

    </div>
  </div>

  <script>
    // Initial Seed Data with 🔥 NOW and 🪩 Not Started status options
    const DEFAULT_GOALS = [
      {
        id: 'g1',
        title: 'Organize Workspace Desk',
        category: 'Small Goals',
        status: 'NOW',
        targetDate: 'By Today',
        notes: [
          { text: 'Clear off desk surface', done: true },
          { text: 'Sort stray papers into tray', done: false },
          { text: 'Wipe down keyboard & screen', done: false }
        ]
      },
      {
        id: 'g2',
        title: 'Drink 2L Water Daily',
        category: 'Small Goals',
        status: 'Started',
        targetDate: 'Daily Habit',
        notes: [
          { text: 'Fill water bottle in morning', done: true },
          { text: 'Set gentle phone timers', done: false }
        ]
      },
      {
        id: 'g3',
        title: 'Launch Personal Portfolio',
        category: 'Big Goals',
        status: 'In Progress',
        targetDate: 'End of Month',
        notes: [
          { text: 'Design homepage layout', done: true },
          { text: 'Write project write-ups', done: false },
          { text: 'Publish live domain link', done: false }
        ]
      },
      {
        id: 'g4',
        title: 'Read 3 Focus Books',
        category: 'Big Goals',
        status: 'Not Started',
        targetDate: 'Q3 Goal',
        notes: [
          { text: 'Atomic Habits', done: false },
          { text: 'Stolen Focus', done: false },
          { text: 'Hyperfocus', done: false }
        ]
      },
      {
        id: 'g5',
        title: 'Trip to Japan',
        category: 'Future Goals',
        status: 'Not Started',
        targetDate: 'Someday Vision',
        notes: [
          { text: 'Save travel budget', done: false },
          { text: 'Research Kyoto itineraries', done: false },
          { text: 'Learn basic Japanese phrases', done: false }
        ]
      }
    ];

    let goalsData = [];
    let draggedGoalId = null;

    // Load Data from LocalStorage with structure normalization
    function loadData() {
      const saved = localStorage.getItem('notion_goals_widget_v2');
      if (saved) {
        try {
          goalsData = JSON.parse(saved);
          // Normalize sub-notes to objects if stored as raw strings in legacy versions
          goalsData.forEach(g => {
            if (g.notes && g.notes.length > 0 && typeof g.notes[0] === 'string') {
              g.notes = g.notes.map(str => ({ text: str, done: false }));
            }
          });
        } catch (e) {
          goalsData = JSON.parse(JSON.stringify(DEFAULT_GOALS));
        }
      } else {
        goalsData = JSON.parse(JSON.stringify(DEFAULT_GOALS));
      }
    }

    // Save Data to LocalStorage & Render UI
    function saveData() {
      localStorage.setItem('notion_goals_widget_v2', JSON.stringify(goalsData));
      renderAll();
    }

    // Reset Default Data
    function resetDefaultData() {
      goalsData = JSON.parse(JSON.stringify(DEFAULT_GOALS));
      saveData();
    }

    // Trigger Dopamine Micro-reward Confetti Burst
    function triggerDopamineConfetti(e) {
      let x = 0.5;
      let y = 0.5;

      if (e && e.clientX) {
        x = e.clientX / window.innerWidth;
        y = e.clientY / window.innerHeight;
      }

      confetti({
        particleCount: 65,
        spread: 75,
        origin: { x: x, y: y },
        colors: ['#EF4444', '#D8F3DC', '#FAD1D9', '#7D99A4', '#FEF3C7', '#D1FAE5'],
        disableForReducedMotion: true
      });
    }

    // Drag and Drop Handlers
    function handleDragStart(e, goalId) {
      draggedGoalId = goalId;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', goalId);
      
      const target = e.currentTarget;
      setTimeout(() => target.classList.add('dragging'), 0);
    }

    function handleDragEnd(e) {
      e.currentTarget.classList.remove('dragging');
      draggedGoalId = null;
      document.querySelectorAll('section.glass-panel').forEach(col => {
        col.classList.remove('drag-over-container');
      });
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }

    function handleDragEnter(e, category) {
      e.preventDefault();
      const colId = getColIdByCategory(category);
      const colEl = document.getElementById(colId);
      if (colEl) colEl.classList.add('drag-over-container');
    }

    function handleDragLeave(e, category) {
      const colId = getColIdByCategory(category);
      const colEl = document.getElementById(colId);
      if (colEl && !colEl.contains(e.relatedTarget)) {
        colEl.classList.remove('drag-over-container');
      }
    }

    function handleDrop(e, category) {
      e.preventDefault();
      const colId = getColIdByCategory(category);
      const colEl = document.getElementById(colId);
      if (colEl) colEl.classList.remove('drag-over-container');

      if (!draggedGoalId) return;

      const goal = goalsData.find(g => g.id === draggedGoalId);
      if (goal && goal.category !== category) {
        goal.category = category;
        saveData();
      }
    }

    function getColIdByCategory(category) {
      if (category === 'Small Goals') return 'col-small';
      if (category === 'Big Goals') return 'col-big';
      if (category === 'Future Goals') return 'col-future';
      return '';
    }

    // Change Goal Status
    function updateGoalStatus(goalId, newStatus, event) {
      if (event) event.stopPropagation();
      const goal = goalsData.find(g => g.id === goalId);
      if (!goal) return;

      const oldStatus = goal.status;
      goal.status = newStatus;

      // Trigger micro-dopamine confetti burst on high focus / progress transitions
      if ((newStatus === 'NOW' || newStatus === 'Started' || newStatus === 'Completed') && oldStatus !== newStatus) {
        triggerDopamineConfetti(event);
      }

      saveData();
    }

    // Toggle Sub-step Checkbox
    function toggleSubstep(goalId, index, event) {
      if (event) event.stopPropagation();
      const goal = goalsData.find(g => g.id === goalId);
      if (!goal || !goal.notes || !goal.notes[index]) return;

      goal.notes[index].done = !goal.notes[index].done;

      if (goal.notes[index].done) {
        triggerDopamineConfetti(event);
      }

      saveData();
    }

    // Change Goal Category via Dropdown
    function moveGoalCategory(goalId, newCategory, event) {
      if (event) event.stopPropagation();
      const goal = goalsData.find(g => g.id === goalId);
      if (!goal) return;

      goal.category = newCategory;
      saveData();
    }

    // Delete Goal
    function deleteGoal(goalId, event) {
      if (event) event.stopPropagation();
      goalsData = goalsData.filter(g => g.id !== goalId);
      saveData();
    }

    // Open Modal for Adding Goal
    function openAddGoalModal(defaultCategory = 'Small Goals') {
      document.getElementById('modal-title').innerHTML = `<i class="fa-solid fa-bullseye text-purple-500"></i> Add New Goal`;
      document.getElementById('form-goal-id').value = '';
      document.getElementById('form-title').value = '';
      document.getElementById('form-category').value = defaultCategory;
      document.getElementById('form-status').value = 'Not Started';
      document.getElementById('form-target-date').value = '';
      document.getElementById('form-notes').value = '';

      document.getElementById('goal-modal').classList.remove('hidden');
    }

    // Open Modal for Editing Goal
    function openEditGoalModal(goalId) {
      const goal = goalsData.find(g => g.id === goalId);
      if (!goal) return;

      document.getElementById('modal-title').innerHTML = `<i class="fa-solid fa-pen-to-square text-purple-500"></i> Edit Goal`;
      document.getElementById('form-goal-id').value = goal.id;
      document.getElementById('form-title').value = goal.title;
      document.getElementById('form-category').value = goal.category;
      document.getElementById('form-status').value = goal.status || 'Not Started';
      document.getElementById('form-target-date').value = goal.targetDate || '';
      
      const notesString = (goal.notes || []).map(n => typeof n === 'string' ? n : n.text).join('\n');
      document.getElementById('form-notes').value = notesString;

      document.getElementById('goal-modal').classList.remove('hidden');
    }

    function closeGoalModal() {
      document.getElementById('goal-modal').classList.add('hidden');
    }

    // Handle Form Submission
    function handleGoalFormSubmit(e) {
      e.preventDefault();

      const id = document.getElementById('form-goal-id').value;
      const title = document.getElementById('form-title').value.trim();
      const category = document.getElementById('form-category').value;
      const status = document.getElementById('form-status').value;
      const targetDate = document.getElementById('form-target-date').value.trim();
      const notesRaw = document.getElementById('form-notes').value;
      
      const notes = notesRaw
        .split('\n')
        .map(n => n.trim())
        .filter(n => n.length > 0)
        .map(text => ({ text, done: false }));

      if (id) {
        // Edit Existing Goal
        const goal = goalsData.find(g => g.id === id);
        if (goal) {
          // preserve checked state for existing notes if text matches
          const existingNotes = goal.notes || [];
          const updatedNotes = notes.map(newNote => {
            const oldNote = existingNotes.find(o => (typeof o === 'string' ? o : o.text) === newNote.text);
            return {
              text: newNote.text,
              done: oldNote ? (typeof oldNote === 'string' ? false : oldNote.done) : false
            };
          });

          goal.title = title;
          goal.category = category;
          goal.status = status;
          goal.targetDate = targetDate;
          goal.notes = updatedNotes;
        }
      } else {
        // Add New Goal
        const newGoal = {
          id: 'g_' + Date.now(),
          title,
          category,
          status,
          targetDate,
          notes
        };
        goalsData.push(newGoal);
        if (status === 'NOW' || status === 'Started' || status === 'Completed') {
          triggerDopamineConfetti(e);
        }
      }

      closeGoalModal();
      saveData();
    }

    // Render Single Goal Column
    function renderColumn(category, containerId, badgeId) {
      const container = document.getElementById(containerId);
      const list = goalsData.filter(g => g.category === category);

      // Update Column Count Badge
      document.getElementById(badgeId).innerText = list.length;

      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = `
          <div class="flex flex-col items-center justify-center py-12 text-center text-slate-500/80 border border-dashed border-slate-300/60 rounded-2xl bg-white/30 h-full min-h-[160px]">
            <i class="fa-solid fa-seedling text-2xl mb-1.5 opacity-40"></i>
            <span class="text-xs font-semibold">No goals here yet</span>
            <button onclick="openAddGoalModal('${category}')" class="mt-2 text-[11px] text-purple-700 font-extrabold underline hover:text-purple-900">Add One</button>
          </div>
        `;
        return;
      }

      list.forEach(goal => {
        const card = document.createElement('div');
        card.className = 'goal-card p-3.5 rounded-2xl flex flex-col gap-2.5 group relative';
        card.setAttribute('draggable', 'true');
        card.setAttribute('ondragstart', `handleDragStart(event, '${goal.id}')`);
        card.setAttribute('ondragend', `handleDragEnd(event)`);

        // Get Badge Style Class
        let badgeClass = 'badge-not-started';
        if (goal.status === 'NOW') {
          badgeClass = 'badge-now';
        } else if (goal.status === 'In Progress') {
          badgeClass = 'badge-in-progress';
        } else if (goal.status === 'Started') {
          badgeClass = 'badge-started';
        } else if (goal.status === 'Completed') {
          badgeClass = 'badge-completed';
        }

        // Render Micro-notes / Sub-steps with interactive checkboxes
        let subNotesHtml = '';
        if (goal.notes && goal.notes.length > 0) {
          const notesList = goal.notes.map((noteObj, idx) => {
            const text = typeof noteObj === 'string' ? noteObj : noteObj.text;
            const isDone = typeof noteObj === 'object' && noteObj.done;
            return `
              <li class="flex items-center gap-2 text-[11px] text-slate-700 font-medium">
                <input type="checkbox" ${isDone ? 'checked' : ''} 
                  onclick="toggleSubstep('${goal.id}', ${idx}, event)"
                  class="w-3.5 h-3.5 rounded text-purple-600 focus:ring-0 cursor-pointer accent-purple-600">
                <span class="truncate ${isDone ? 'line-through text-slate-400' : ''}">${escapeHtml(text)}</span>
              </li>
            `;
          }).join('');

          const completedCount = goal.notes.filter(n => typeof n === 'object' && n.done).length;
          const progressPct = Math.round((completedCount / goal.notes.length) * 100);

          subNotesHtml = `
            <div class="mt-1 bg-slate-50/80 p-2 rounded-xl border border-slate-200/60 flex flex-col gap-1.5">
              <div class="flex items-center justify-between text-[9px] font-bold text-slate-500">
                <span>Micro-steps</span>
                <span>${completedCount}/${goal.notes.length} (${progressPct}%)</span>
              </div>
              <div class="w-full h-1 bg-slate-200 rounded-full overflow-hidden">
                <div class="h-full bg-emerald-500 rounded-full transition-all duration-300" style="width: ${progressPct}%"></div>
              </div>
              <ul class="flex flex-col gap-1 mt-0.5">${notesList}</ul>
            </div>
          `;
        }

        card.innerHTML = `
          <!-- Header: Title & Actions -->
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0 cursor-pointer flex-1" onclick="openEditGoalModal('${goal.id}')">
              <h3 class="text-xs font-extrabold text-slate-800 leading-snug hover:text-purple-600 transition ${goal.status === 'Completed' ? 'line-through text-slate-400' : ''}">
                ${goal.status === 'NOW' ? '<span class="inline-block animate-bounce mr-1">🔥</span>' : ''} ${escapeHtml(goal.title)}
              </h3>
              ${goal.targetDate ? `<p class="text-[10px] font-bold text-slate-400 mt-0.5 flex items-center gap-1"><i class="fa-regular fa-clock text-[9px]"></i> ${escapeHtml(goal.targetDate)}</p>` : ''}
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition">
              <button onclick="openEditGoalModal('${goal.id}')" title="Edit goal" class="w-5 h-5 rounded hover:bg-slate-200/60 text-slate-500 text-[10px] flex items-center justify-center">
                <i class="fa-solid fa-pen"></i>
              </button>
              <button onclick="deleteGoal('${goal.id}', event)" title="Delete goal" class="w-5 h-5 rounded hover:bg-rose-100 text-rose-500 text-[10px] flex items-center justify-center">
                <i class="fa-regular fa-trash-can"></i>
              </button>
            </div>
          </div>

          <!-- Sub-notes -->
          ${subNotesHtml}

          <!-- Footer: Quick Status Pill & Quick Move Dropdown -->
          <div class="flex items-center justify-between gap-1 pt-1.5 border-t border-slate-100 mt-0.5">
            <!-- Quick Status Selector -->
            <select onchange="updateGoalStatus('${goal.id}', this.value, event)" 
              class="text-[10px] font-extrabold px-2 py-0.5 rounded-lg cursor-pointer outline-none transition ${badgeClass}">
              <option value="NOW" ${(goal.status === 'NOW') ? 'selected' : ''}>🔥 NOW</option>
              <option value="Not Started" ${(goal.status === 'Not Started' || !goal.status) ? 'selected' : ''}>🪩 Not Started</option>
              <option value="In Progress" ${goal.status === 'In Progress' ? 'selected' : ''}>🟡 In Progress</option>
              <option value="Started" ${goal.status === 'Started' ? 'selected' : ''}>🌸 Started</option>
              <option value="Completed" ${goal.status === 'Completed' ? 'selected' : ''}>❇️ Completed</option>
            </select>

            <!-- Quick Column Move Dropdown -->
            <select onchange="moveGoalCategory('${goal.id}', this.value, event)" title="Move goal to another category" 
              class="text-[9px] font-bold text-slate-500 bg-white/70 hover:bg-white border border-slate-200 rounded-md px-1.5 py-0.5 outline-none transition">
              <option value="Small Goals" ${goal.category === 'Small Goals' ? 'selected' : ''}>🌱 Small</option>
              <option value="Big Goals" ${goal.category === 'Big Goals' ? 'selected' : ''}>⚡ Big</option>
              <option value="Future Goals" ${goal.category === 'Future Goals' ? 'selected' : ''}>✨ Future</option>
            </select>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // Render All Columns & Summary Metrics
    function renderAll() {
      renderColumn('Small Goals', 'container-small', 'badge-small');
      renderColumn('Big Goals', 'container-big', 'badge-big');
      renderColumn('Future Goals', 'container-future', 'badge-future');

      // Overall Summary
      const totalGoals = goalsData.length;
      const nowGoals = goalsData.filter(g => g.status === 'NOW').length;
      const completedGoals = goalsData.filter(g => g.status === 'Completed').length;

      document.getElementById('now-goal-stats').innerText = `${nowGoals} NOW Focus`;
      document.getElementById('overall-goal-stats').innerText = `${completedGoals}/${totalGoals} Done`;
    }

    // Utility: HTML Escaping
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Window Init
    window.onload = function() {
      loadData();
      renderAll();
    };
  </script>
</body>
</html>
