<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: transparent; margin: 0; padding: 10px; }
  
  .container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }

  .card {
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    transition: transform 0.2s ease;
  }
  .card:hover { transform: translateY(-3px); }

  .small-goals { background-color: #E2F0CB; color: #4A6B34; }
  .big-goals { background-color: #E8D7F5; color: #5B3A70; }
  .future-goals { background-color: #FFE5D9; color: #7A4B3A; }

  h3 { margin: 0 0 12px 0; font-size: 1.1rem; display: flex; align-items: center; gap: 6px; }

  .goal-item {
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(4px);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.9rem;
  }

  .status {
    font-size: 0.75rem;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .status-not-started { background: #D0E1FD; color: #2B4C7E; }
  .status-in-progress { background: #FFF1C5; color: #7A6200; }
  .status-started { background: #FFC6FF; color: #702070; }
</style>
</head>
<body>

<div class="container">
  <!-- Small Goals Block -->
  <div class="card small-goals">
    <h3>🌱 Small Goals</h3>
    <div class="goal-item">
      <span>Organize desk</span>
      <span class="status status-in-progress">In Progress</span>
    </div>
    <div class="goal-item">
      <span>Drink 2L Water</span>
      <span class="status status-started">Started</span>
    </div>
  </div>

  <!-- Big Goals Block -->
  <div class="card big-goals">
    <h3>⚡ Big Goals</h3>
    <div class="goal-item">
      <span>Launch Portfolio</span>
      <span class="status status-in-progress">In Progress</span>
    </div>
    <div class="goal-item">
      <span>Read 2 Books</span>
      <span class="status status-not-started">Not Started</span>
    </div>
  </div>

  <!-- Future Goals Block -->
  <div class="card future-goals">
    <h3>✨ Future Goals</h3>
    <div class="goal-item">
      <span>Trip to Japan</span>
      <span class="status status-not-started">Not Started</span>
    </div>
    <div class="goal-item">
      <span>Learn Spanish</span>
      <span class="status status-not-started">Not Started</span>
    </div>
  </div>
</div>

</body>
</html>
